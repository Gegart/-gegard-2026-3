<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика | Гепард Про</title>
    <style>
        /* ==================== ТВОЙ СТИЛЬ ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-green: #00ff00;
            --neon-red: #ff0055;
            --neon-purple: #9d00ff;
            --dark-bg: #0a0514;
            --glass-bg: rgba(10, 5, 20, 0.7);
        }
        
        body {
            background: var(--dark-bg);
            color: white;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        
        /* НЕОНОВЫЙ ФОН */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, var(--neon-pink) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, var(--neon-cyan) 0%, transparent 25%),
                radial-gradient(circle at 40% 80%, var(--neon-purple) 0%, transparent 20%);
            opacity: 0.15;
            z-index: -2;
        }
        
        .container {
            max-width: 1200px;
            width: 95%;
            margin: 40px auto;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 3px solid transparent;
            border-image: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple)) 1;
            position: relative;
            box-shadow: 
                0 0 60px rgba(255, 0, 255, 0.4),
                0 0 120px rgba(0, 255, 255, 0.2);
        }
        
        /* ГЛИТЧ-ЗАГОЛОВОК */
        .glitch-container {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }
        
        .glitch-text {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            background: linear-gradient(
                90deg,
                var(--neon-red),
                var(--neon-pink),
                var(--neon-purple),
                var(--neon-cyan),
                var(--neon-green),
                var(--neon-yellow)
            );
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbowText 6s linear infinite;
            text-shadow: 0 0 20px currentColor;
        }
        
        @keyframes rainbowText {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }
        
        /* СТАТИСТИКА В РЕАЛЬНОМ ВРЕМЕНИ */
        .live-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
        }
        
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .stat-value {
            font-size: 2.8rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--neon-yellow);
            text-shadow: 0 0 15px currentColor;
        }
        
        .stat-label {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        /* ГРАФИКИ */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        
        .chart-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .chart-title {
            color: var(--neon-cyan);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chart {
            height: 200px;
            position: relative;
            overflow: hidden;
        }
        
        .bar {
            position: absolute;
            bottom: 0;
            background: linear-gradient(to top, var(--neon-pink), var(--neon-cyan));
            width: 30px;
            border-radius: 5px 5px 0 0;
            transition: height 0.5s ease;
        }
        
        /* СПИСОК ПОСЕТИТЕЛЕЙ */
        .visitors-list {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin: 40px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 400px;
            overflow-y: auto;
        }
        
        .visitor-item {
            display: grid;
            grid-template-columns: 50px 1fr 100px 120px 80px;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            align-items: center;
            transition: all 0.3s;
        }
        
        .visitor-item:hover {
            background: rgba(0, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .visitor-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .visitor-info {
            display: flex;
            flex-direction: column;
        }
        
        .visitor-name {
            font-weight: bold;
            color: var(--neon-yellow);
        }
        
        .visitor-ip {
            font-size: 0.8rem;
            color: #aaa;
        }
        
        .visitor-time {
            color: var(--neon-cyan);
            font-size: 0.9rem;
        }
        
        .visitor-location {
            color: var(--neon-green);
            font-size: 0.9rem;
        }
        
        .visitor-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            justify-self: center;
        }
        
        .status-online {
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 2s infinite;
        }
        
        .status-offline {
            background: #666;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* КАРТА */
        .map-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin: 40px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 300px;
            position: relative;
            overflow: hidden;
        }
        
        .map-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--neon-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--neon-pink);
            animation: mapPulse 3s infinite;
        }
        
        @keyframes mapPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
        }
        
        /* УВЕДОМЛЕНИЯ */
        .notifications {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
        }
        
        .notification {
            background: rgba(10, 5, 20, 0.95);
            border-left: 4px solid var(--neon-cyan);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            .container {
                padding: 25px;
                margin: 20px auto;
            }
            
            .live-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .visitor-item {
                grid-template-columns: 40px 1fr;
                grid-template-rows: auto auto;
                gap: 10px;
            }
            
            .visitor-time, .visitor-location {
                grid-column: 2;
            }
        }
        
        @media (max-width: 480px) {
            .live-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- УВЕДОМЛЕНИЯ -->
    <div class="notifications" id="notifications"></div>
    
    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="container">
        <!-- ЗАГОЛОВОК -->
        <div class="glitch-container">
            <h1 class="glitch-text">АНАЛИТИКА В РЕАЛЬНОМ ВРЕМЕНИ</h1>
        </div>
        
        <div style="text-align: center; color: var(--neon-pink); font-size: 1.2rem; margin-bottom: 30px;">
            <i class="fas fa-chart-line"></i> Мониторинг посетителей и активности
        </div>
        
        <!-- СТАТИСТИКА В РЕАЛЬНОМ ВРЕМЕНИ -->
        <div class="live-stats">
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--neon-cyan);">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-value" id="totalVisitors">0</div>
                <div class="stat-label">ВСЕГО ПОСЕТИТЕЛЕЙ</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--neon-green);">
                    <i class="fas fa-user-clock"></i>
                </div>
                <div class="stat-value" id="onlineNow">0</div>
                <div class="stat-label">ОНЛАЙН СЕЙЧАС</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--neon-yellow);">
                    <i class="fas fa-download"></i>
                </div>
                <div class="stat-value" id="totalDownloads">0</div>
                <div class="stat-label">СКАЧИВАНИЙ</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--neon-pink);">
                    <i class="fas fa-globe"></i>
                </div>
                <div class="stat-value" id="countriesCount">0</div>
                <div class="stat-label">СТРАН</div>
            </div>
        </div>
        
        <!-- ГРАФИКИ -->
        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">
                    <i class="fas fa-chart-bar"></i> Посещаемость по часам
                </div>
                <div class="chart" id="hourlyChart">
                    <!-- Будет заполнено JS -->
                </div>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">
                    <i class="fas fa-music"></i> Активность скачиваний
                </div>
                <div class="chart" id="downloadsChart">
                    <!-- Будет заполнено JS -->
                </div>
            </div>
        </div>
        
        <!-- КАРТА ПОСЕТИТЕЛЕЙ -->
        <div class="map-container" id="visitorsMap">
            <div style="position: absolute; top: 15px; left: 15px; color: var(--neon-cyan);">
                <i class="fas fa-map-marked-alt"></i> География посетителей
            </div>
            <!-- Точки будут добавлены через JS -->
        </div>
        
        <!-- СПИСОК ПОСЕТИТЕЛЕЙ -->
        <div class="visitors-list">
            <div class="chart-title" style="margin-bottom: 20px;">
                <i class="fas fa-list"></i> Последние посетители
            </div>
            <div id="visitorsTable">
                <!-- Заполнится через JS -->
                <div style="text-align: center; padding: 40px; color: #666;">
                    <i class="fas fa-spinner fa-spin"></i> Загрузка данных...
                </div>
            </div>
        </div>
        
        <!-- КНОПКИ УПРАВЛЕНИЯ -->
        <div style="text-align: center; margin-top: 40px;">
            <button onclick="exportData()" 
                    style="background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
                           color: white; border: none; padding: 15px 30px; border-radius: 25px;
                           margin: 0 10px; cursor: pointer; font-size: 1rem;">
                <i class="fas fa-file-export"></i> Экспорт данных
            </button>
            
            <button onclick="clearOldData()" 
                    style="background: linear-gradient(90deg, var(--neon-red), var(--neon-pink));
                           color: white; border: none; padding: 15px 30px; border-radius: 25px;
                           margin: 0 10px; cursor: pointer; font-size: 1rem;">
                <i class="fas fa-trash"></i> Очистить старые данные
            </button>
            
            <button onclick="simulateVisitor()" 
                    style="background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
                           color: white; border: none; padding: 15px 30px; border-radius: 25px;
                           margin: 0 10px; cursor: pointer; font-size: 1rem;">
                <i class="fas fa-robot"></i> Тестовый посетитель
            </button>
        </div>
        
        <!-- ВОЗВРАТ -->
        <div style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <a href="index.html" 
               style="display: inline-flex; align-items: center; gap: 10px;
                      color: var(--neon-cyan); text-decoration: none; font-size: 1.1rem;">
                <i class="fas fa-arrow-left"></i> На главную
            </a>
            
            <a href="admin-maintenance.html" 
               style="display: inline-flex; align-items: center; gap: 10px; margin-left: 20px;
                      color: var(--neon-pink); text-decoration: none; font-size: 1.1rem;">
                <i class="fas fa-tools"></i> Управление тех. работами
            </a>
        </div>
    </div>

    <script>
        // ==================== ПЕРЕМЕННЫЕ ====================
        let visitors = [];
        let onlineUsers = new Set();
        let countries = new Set();
        
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📊 Аналитика загружена');
            
            // Загружаем данные
            loadAnalyticsData();
            
            // Обновляем статистику
            updateStats();
            
            // Рисуем графики
            drawCharts();
            
            // Рисуем карту
            drawMap();
            
            // Запускаем обновление в реальном времени
            setInterval(updateRealtime, 5000);
            
            // Симулируем активность для демо
            simulateInitialData();
            
            // Проверяем WebSocket соединение (если нужно)
            initWebSocket();
        });
        
        // ==================== ЗАГРУЗКА ДАННЫХ ====================
        function loadAnalyticsData() {
            // Загружаем посетителей
            const savedVisitors = localStorage.getItem('gepard_visitors');
            if (savedVisitors) {
                visitors = JSON.parse(savedVisitors);
            }
            
            // Загружаем скачивания
            const savedDownloads = localStorage.getItem('gepard_downloads');
            if (savedDownloads) {
                // Можно добавить обработку
            }
            
            // Загружаем онлайн пользователей
            const savedOnline = localStorage.getItem('gepard_online');
            if (savedOnline) {
                onlineUsers = new Set(JSON.parse(savedOnline));
            }
            
            console.log(`👥 Загружено ${visitors.length} посетителей`);
        }
        
        // ==================== ОБНОВЛЕНИЕ СТАТИСТИКИ ====================
        function updateStats() {
            // Всего посетителей
            document.getElementById('totalVisitors').textContent = visitors.length;
            
            // Онлайн сейчас (симуляция)
            const onlineCount = Math.min(visitors.length, Math.floor(Math.random() * 10) + 3);
            document.getElementById('onlineNow').textContent = onlineCount;
            
            // Скачивания
            const downloads = parseInt(localStorage.getItem('totalDownloads')) || 0;
            document.getElementById('totalDownloads').textContent = downloads;
            
            // Страны (собираем из посетителей)
            countries.clear();
            visitors.forEach(v => {
                if (v.country) countries.add(v.country);
            });
            document.getElementById('countriesCount').textContent = countries.size;
        }
        
        // ==================== ГРАФИКИ ====================
        function drawCharts() {
            // График по часам
            const hours = Array.from({length: 24}, (_, i) => i);
            const hourlyData = hours.map(hour => {
                return visitors.filter(v => {
                    const date = new Date(v.timestamp);
                    return date.getHours() === hour;
                }).length;
            });
            
            const maxHourly = Math.max(...hourlyData) || 1;
            const hourlyChart = document.getElementById('hourlyChart');
            hourlyChart.innerHTML = '';
            
            hours.forEach((hour, index) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.left = `${(index * 35) + 10}px`;
                bar.style.height = `${(hourlyData[index] / maxHourly) * 180}px`;
                bar.title = `${hour}:00 - ${hourlyData[index]} посетителей`;
                hourlyChart.appendChild(bar);
            });
            
            // График скачиваний (симуляция)
            const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            const downloadsData = days.map(() => Math.floor(Math.random() * 50) + 10);
            const maxDownloads = Math.max(...downloadsData);
            const downloadsChart = document.getElementById('downloadsChart');
            downloadsChart.innerHTML = '';
            
            days.forEach((day, index) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.left = `${(index * 40) + 15}px`;
                bar.style.height = `${(downloadsData[index] / maxDownloads) * 180}px`;
                bar.style.background = 'linear-gradient(to top, var(--neon-green), var(--neon-cyan))';
                bar.title = `${day}: ${downloadsData[index]} скачиваний`;
                downloadsChart.appendChild(bar);
                
                // Подпись дня
                const label = document.createElement('div');
                label.textContent = day;
                label.style.position = 'absolute';
                label.style.bottom = '-25px';
                label.style.left = `${(index * 40) + 15}px`;
                label.style.transform = 'translateX(-50%)';
                label.style.color = '#aaa';
                label.style.fontSize = '0.8rem';
                downloadsChart.appendChild(label);
            });
        }
        
        // ==================== КАРТА ====================
        function drawMap() {
            const mapContainer = document.getElementById('visitorsMap');
            mapContainer.innerHTML = '<div style="position: absolute; top: 15px; left: 15px; color: var(--neon-cyan);"><i class="fas fa-map-marked-alt"></i> География посетителей</div>';
            
            // Координаты для симуляции (Москва, СПб, Киев, Минск, Алматы)
            const cities = [
                {name: 'Москва', x: 50, y: 30},
                {name: 'Санкт-Петербург', x: 45, y: 25},
                {name: 'Киев', x: 40, y: 35},
                {name: 'Минск', x: 38, y: 28},
                {name: 'Алматы', x: 70, y: 40},
                {name: 'Нью-Йорк', x: 20, y: 45},
                {name: 'Лондон', x: 30, y: 30},
                {name: 'Токио', x: 85, y: 35}
            ];
            
            cities.forEach(city => {
                const point = document.createElement('div');
                point.className = 'map-point';
                point.style.left = `${city.x}%`;
                point.style.top = `${city.y}%`;
                point.title = city.name;
                mapContainer.appendChild(point);
                
                // Количество посетителей из этого города
                const count = Math.floor(Math.random() * 20) + 1;
                const label = document.createElement('div');
                label.textContent = `${city.name} (${count})`;
                label.style.position = 'absolute';
                label.style.left = `${city.x}%`;
                label.style.top = `${city.y - 5}%`;
                label.style.transform = 'translateX(-50%)';
                label.style.color = 'var(--neon-yellow)';
                label.style.fontSize = '0.8rem';
                label.style.whiteSpace = 'nowrap';
                mapContainer.appendChild(label);
            });
        }
        
        // ==================== ТАБЛИЦА ПОСЕТИТЕЛЕЙ ====================
        function updateVisitorsTable() {
            const container = document.getElementById('visitorsTable');
            const recentVisitors = visitors.slice(-10).reverse(); // Последние 10
            
            if (recentVisitors.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">Нет данных о посетителях</div>';
                return;
            }
            
            let html = '';
            
            recentVisitors.forEach(visitor => {
                const time = new Date(visitor.timestamp).toLocaleTimeString();
                const date = new Date(visitor.timestamp).toLocaleDateString();
                const isOnline = Math.random() > 0.7; // Симуляция онлайн статуса
                
                html += `
                    <div class="visitor-item">
                        <div class="visitor-avatar">
                            ${visitor.name ? visitor.name.charAt(0).toUpperCase() : '?'}
                        </div>
                        <div class="visitor-info">
                            <div class="visitor-name">${visitor.name || 'Анонимный пользователь'}</div>
                            <div class="visitor-ip">IP: ${visitor.ip || '192.168.1.1'}</div>
                        </div>
                        <div class="visitor-time">${time}</div>
                        <div class="visitor-location">${visitor.country || 'Неизвестно'}</div>
                        <div class="visitor-status ${isOnline ? 'status-online' : 'status-offline'}"></div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ==================== УВЕДОМЛЕНИЯ ====================
        function showNotification(message, type = 'info') {
            const notifications = document.getElementById('notifications');
            const notification = document.createElement('div');
            notification.className = 'notification';
            
            let icon = 'fa-info-circle';
            let color = 'var(--neon-cyan)';
            
            if (type === 'success') {
                icon = 'fa-check-circle';
                color = 'var(--neon-green)';
            } else if (type === 'warning') {
                icon = 'fa-exclamation-triangle';
                color = 'var(--neon-yellow)';
            } else if (type === 'error') {
                icon = 'fa-times-circle';
                color = 'var(--neon-red)';
            } else if (type === 'user') {
                icon = 'fa-user-plus';
                color = 'var(--neon-pink)';
            }
            
            notification.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas ${icon}" style="color: ${color};"></i>
                    <div>${message}</div>
                </div>
            `;
            
            notifications.appendChild(notification);
            
            // Автоудаление через 5 секунд
            setTimeout(() => {
                notification.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 300);
            }, 5000);
        }
        
        // ==================== СИМУЛЯЦИЯ ДАННЫХ ====================
        function simulateInitialData() {
            // Если мало данных - создаём демо-данные

                        device: 'Mobile',

                        timestamp: Date.now() - 7200000,

                    },
                    {

                        name: 'Джон Смит',

        function simulateVisitor() {
            const names = ['Иван Иванов', 'Анна Ковалёва', 'Сергей Смирнов', 'Ольга Новикова', 'Дмитрий Попов'];
            const countries = ['Россия', 'Украина', 'Беларусь', 'Казахстан', 'США', 'Германия', 'Великобритания'];
            const cities = ['Москва', 'Санкт-Петербург', 'Киев', 'Минск', 'Алматы', 'Нью-Йорк', 'Берлин'];
            
            const newVisitor = {
                id: 'sim_' + Date.now(),
                name: names[Math.floor(Math.random() * names.length)],
                ip: `${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`,
                country: countries[Math.floor(Math.random() * countries.length)],
                city: cities[Math.floor(Math.random() * cities.length)],
                device: Math.random() > 0.5 ? 'Desktop' : 'Mobile',
                browser: ['Chrome', 'Firefox', 'Safari', 'Edge'][Math.floor(Math.random() * 4)],
                timestamp: Date.now(),
                duration: Math.floor(Math.random() * 600) + 60
            };
            
            visitors.push(newVisitor);
            saveVisitorsData();
            
            updateStats();
            updateVisitorsTable();
            showNotification(`Новый посетитель: ${newVisitor.name} из ${newVisitor.city}`, 'user');
            
            // Обновляем графики
            setTimeout(drawCharts, 100);
        }
        
        // ==================== ОБНОВЛЕНИЕ В РЕАЛЬНОМ ВРЕМЕНИ ====================
        function updateRealtime() {
            // Обновляем онлайн счетчик
            const newOnline = Math.max(1, Math.floor(Math.random() * 5));
            document.getElementById('onlineNow').textContent = newOnline;
            
            // Иногда добавляем нового посетителя
            if (Math.random() > 0.7) {
                simulateVisitor();
            }
            
            // Пульсация точек на карте
            document.querySelectorAll('.map-point').forEach(point => {
                point.style.animation = 'none';
                setTimeout(() => {
                    point.style.animation = 'mapPulse 3s infinite';
                }, 10);
            });
        }
        
        // ==================== WEB SOCKET (опционально) ====================
        function initWebSocket() {
            // Здесь можно подключить WebSocket для реального времени
            console.log('📡 WebSocket не подключен (режим демо)');
        }
        
        // ==================== СОХРАНЕНИЕ ДАННЫХ ====================
        function saveVisitorsData() {
            localStorage.setItem('gepard_visitors', JSON.stringify(visitors));
        }
        
        // ==================== ЭКСПОРТ ДАННЫХ ====================
        function exportData() {
            const data = {
                visitors: visitors,
                totalDownloads: parseInt(localStorage.getItem('totalDownloads')) || 0,
                totalVisitors: visitors.length,
                exportDate: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gepard-analytics-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showNotification('Данные экспортированы в JSON', 'success');
        }
        
        // ==================== ОЧИСТКА ДАННЫХ ====================
        function clearOldData() {
            if (confirm('Удалить все данные старше 30 дней?')) {
                const monthAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
                visitors = visitors.filter(v => v.timestamp > monthAgo);
                saveVisitorsData();
                
                updateStats();
                updateVisitorsTable();
                showNotification('Старые данные очищены', 'success');
            }
        }
    </script>
